name: dongla_care1
description: "تطبيق دنقلا كير للخدمات الصحية"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.1.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # إصلاح حرج: كان قسم assets بالكامل محذوفاً من هذا الملف.
  # هذا يعني أن Flutter لا يضمّ صور assets/images/ ولا ملف قاعدة
  # البيانات assets/dongola_health_guide.db داخل التطبيق عند البناء،
  # حتى لو كانت الملفات موجودة فعلياً على القرص. هذا هو السبب الجذري
  # لعدم ظهور صور السلايدر، ولظهور شاشة المرافق فارغة على أي جهاز
  # جديد لا توجد فيه نسخة قديمة من قاعدة البيانات محفوظة محلياً من قبل.
  assets:
    - assets/dongola_health_guide.db
    - assets/images/
